defaults:
  - default
  - ../model@model: whisper_small_v2
  - _self_

compile: true          # PyTorch 2.0 optimization
mixed_precision: 'bf16'         # Enable mixed precision (no/fp16/bf16)

data:                  # Data settings
  dataset_type: "adofai"
  train_dataset_path: "/workspace/datasets/adofai-top100"  # Placeholder: user should override
  test_dataset_path: "/workspace/datasets/adofai-top100"
  train_dataset_start: 0
  train_dataset_end: 113  # 90% of 126 charts
  test_dataset_start: 113
  test_dataset_end: 126
  num_classes: 0  # Not used for ADOFAI
  
  # ADOFAI lossless augmentation (continuous uniform, independent)
  # Each chart yields ONE augmented variant per epoch with random sampling
  # Transforms are INDEPENDENT (rotate AND reflect MAY both apply)
  adofai_rotate_prob: 1.0          # Probability of rotation; R ~ Uniform[0, 360)
  adofai_reflect_prob: 0.5         # Probability of reflection; axis ~ {X, Y, y=x, y=-x}
  adofai_rate_prob: 0.5            # Probability of matched-rate; r ~ Uniform[0.85, 1.25]
  adofai_rate_range: [0.85, 1.25]
  adofai_pitch_prob: 0.5           # Probability of pitch-shift; settings.pitch ~ Uniform[80, 120]
  adofai_pitch_range: [80, 120]
  # Each transform is sampled independently; no discrete steps or XOR locks
  
  # Special Prefix Tokens (ADOFAI configuration)
  add_out_context_types: true  # Add tokens indicating types of the out context
  add_gamemode_token: false    # ADOFAI has no gamemode
  add_style_token: false       # Tyler: NO style tags
  add_diff_token: true         # Researcher + v29: difficulty ON
  add_mapper_token: false      # Tyler: NO mapper tags
  add_year_token: false        # Tyler: NO year tags
  add_hitsounded_token: false  # Not applicable to ADOFAI
  add_song_length_token: false
  add_global_sv_token: false   # ADOFAI uses SetSpeed, not osu SV
  add_cs_token: false          # Not applicable
  add_keycount_token: false    # Not applicable
  add_hold_note_ratio_token: false
  add_scroll_speed_ratio_token: false
  add_descriptors: false       # Tyler: NO descriptors
  add_sv_special_token: false
  add_kiai_special_token: false
  add_song_position_token: false
  
  # Difficulty configuration
  num_diff_classes: 24         # RBF bins for difficulty embedding
  max_diff: 20                 # Max difficulty value
  
  # ---
  timing_random_offset: 2
  src_seq_len: 4096            # v31: longer context (32.8s @ 16kHz, hop 128)
  tgt_seq_len: 8192            # v31: longer target
  rhythm_weight: 1.0           # v31/v29: Weight of rhythm tokens in loss
  
  context_types:               # ADOFAI context: timing first, then notes/actions
    - "in": ['${context_type:none}']
      "out": ['${context_type:timing}', '${context_type:map}']
  
  context_weights: [1]
  
  add_timing: false      # Interweave timing tokens with the beatmap tokens
  add_snapping: false    # ADOFAI doesn't use snap divisors like osu
  add_timing_points: false
  add_hitsounds: false   # ADOFAI hitsounds are separate events
  add_pre_tokens: false
  per_track: false
  add_distances: false   # Not applicable to ADOFAI
  add_positions: false   # ADOFAI uses angles, not XY positions
  dt_augment_prob: 0.0   # No DT augmentation (use pitch shift instead if needed)
  types_first: true      # Put the type token at the start of the group
  add_kiai: false
  gamemodes: []          # ADOFAI has no gamemode
  add_sv: false          # ADOFAI uses SetSpeed events

dataloader:             # Dataloader settings
  num_workers: 32

optim:                  # Optimizer settings (v31 muon recipe)
  name: muon
  base_lr: 1e-2         # Should not be scaled with the number of devices present
  batch_size: 32        # Batch size per GPU (for 4 GPUs = 128 total; single GPU use 8-16)
  grad_acc: 1
  total_steps: 65536    # v31: full training steps
  warmup_steps: 0
  final_cosine: 1e-5
